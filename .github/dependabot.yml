# Weekly grouped updates. Minor and patch bumps land in one PR per ecosystem;
# major bumps stay separate so breaking changes get looked at on their own.
# Security updates are not limited by this schedule.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule:
      interval: weekly
    groups:
      # Kit and its adapters move together across majors (adapter-static 4
      # needs Kit 3), so they share one PR including major bumps.
      svelte:
        patterns: [svelte, svelte-*, "@sveltejs/*"]
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
