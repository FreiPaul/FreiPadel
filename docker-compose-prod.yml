# Production compose file. `make ship` / `make ship-local-build` install this
# on the server as docker-compose.yml — keep it in sync with the local
# docker-compose.yml except for deliberate prod differences.
services:
  freipadel:
    build: .
    # Tag the built image explicitly so `make ship-local-build` can push a
    # pre-built image and have `docker compose up` (no --build) pick it up.
    image: freipadel:latest
    container_name: freipadel
    restart: unless-stopped
    # Run as the owner of the server's ./data directory. The Makefile writes
    # FREIPADEL_UID/GID into .env next to this file on every ship.
    user: "${FREIPADEL_UID:-10001}:${FREIPADEL_GID:-10001}"
    # Hardening: the root filesystem is read-only (only /data and a small
    # /tmp are writable), no Linux capabilities, no privilege escalation via
    # setuid binaries, and limits so a runaway process cannot take the host
    # down with it.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    ports:
      - "8080:8080"
    volumes:
      # SQLite database + scraper config.json live here
      - ./data:/data
    env_file:
      - ./data/production.env
    environment:
      # How often to re-scrape court availability
      SCRAPE_INTERVAL_MINUTES: "30"
      # Prod is served over HTTPS (reverse proxy), so session cookies are
      # marked Secure and never sent over plain HTTP.
      COOKIE_SECURE: "1"
      # Canonical public URL. Links in outgoing email (poll notifications,
      # invites, email-change confirmations) are built from this instead of the
      # origin the client sends, which is not trustworthy.
      PUBLIC_ORIGIN: "https://freipadel.freipaul.com"
